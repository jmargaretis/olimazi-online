<!doctype html>
<html><head><meta charset="utf-8">
<title>Clip stage</title>
<style>
@font-face{font-family:"Satoshi";src:url("../../assets/Satoshi-Black.otf");font-weight:900}
@font-face{font-family:"Satoshi";src:url("../../assets/Satoshi-Bold.otf");font-weight:700}
@font-face{font-family:"Satoshi";src:url("../../assets/Satoshi-Medium.otf");font-weight:500}
:root{--paper:#E9EEF1;--sheet:#F4F7F9;--ink:#16202A;--ink-soft:#4E5C68;--ox:#C0392B;--hair:rgba(22,32,42,.16)}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--paper)}
body{font-family:"Satoshi",system-ui,sans-serif;color:var(--ink);position:relative}
.kick{position:absolute;left:48px;top:52px;font:700 19px/1 "Courier New",monospace;letter-spacing:.22em;color:var(--ink-soft)}
.kick b{color:var(--ox);font-weight:700}
.head{position:absolute;left:48px;top:92px;width:984px;font:900 70px/1.02 "Satoshi";letter-spacing:-.01em}
.head .r{color:var(--ox)}
.screen{position:absolute;left:40px;top:290px;width:1000px;height:700px;overflow:hidden;background:var(--sheet);
  border:2px solid var(--ink);box-shadow:10px 10px 0 rgba(22,32,42,.14)}
.screen img{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
svg.ov{position:absolute;left:0;top:0;width:1000px;height:700px;overflow:visible}
.tag{position:absolute;background:var(--ox);color:#fff;font:900 22px/1 "Satoshi";padding:6px 8px}
.cap{position:absolute;left:48px;top:1036px;width:984px;display:flex;gap:22px;align-items:flex-start}
.cap .n{font:900 56px/1 "Satoshi";color:var(--ox);min-width:78px}
.cap .t{font:700 42px/1.2 "Satoshi";color:var(--ink)}
.foot{position:absolute;left:48px;right:48px;bottom:44px;display:flex;align-items:center;justify-content:space-between;border-top:1.5px solid var(--hair);padding-top:22px}
.mark{display:flex;align-items:center;gap:12px;font:900 28px/1 "Satoshi"}
.mark img{width:48px;height:48px;mix-blend-mode:multiply}
.mark .o{color:var(--ox)}
.ticks{display:flex;gap:8px}.ticks i{display:block;width:44px;height:5px;background:var(--hair)}.ticks i.on{background:var(--ink)}
.cursor{position:absolute;width:34px;height:34px;pointer-events:none}
.ring{position:absolute;border:3px solid var(--ox);border-radius:50%}
.end{position:absolute;inset:0;background:var(--paper);padding:0 48px;display:flex;flex-direction:column;justify-content:center}
.end h2{font:900 118px/.98 "Satoshi";letter-spacing:-.015em}
.end h2 small{display:block;font:900 60px/1.1 "Satoshi";color:var(--ink-soft);margin-top:10px}
.end p{font:700 42px/1.25 "Satoshi";margin-top:48px;color:var(--ink)}
.end .cta{margin-top:56px;display:flex;align-items:baseline;gap:24px;border-top:3px solid var(--ink);padding-top:28px}
.end .cta b{font:900 48px/1 "Satoshi";color:var(--ox)}
.end .cta span{font:900 48px/1 "Satoshi"}
.end .cta span i{font-style:normal;color:var(--ox)}
/* wide: landscape cut for the site cards */
.wide,.wide body{width:1600px;height:1150px}
.wide .kick{left:40px;top:40px}
.wide .head{left:40px;top:74px;width:1520px;font-size:58px}
.wide .head br{display:none}
.wide .screen{left:40px;top:170px;width:1200px;height:840px}
.wide svg.ov{width:1200px;height:840px}
.wide .cap{left:1276px;top:186px;width:290px;flex-direction:column;gap:14px}
.wide .cap .t{font-size:34px}
.wide .foot{left:40px;right:40px;bottom:30px;padding-top:16px}
.wide .end{padding:0 120px}
</style></head>
<body>
<script>if (/[?&]wide=1/.test(location.search)) document.documentElement.className = 'wide';</script>
<div class="kick" id="kick"></div>
<div class="head" id="head"></div>
<div class="screen" id="screen">
  <img id="imA" alt=""><img id="imB" alt="">
  <svg class="ov" id="ov"></svg>
  <div id="tags"></div>
  <svg class="cursor" id="cur" viewBox="0 0 24 24"><path d="M4 2 L4 19 L8.6 14.8 L11.6 21.6 L14.4 20.4 L11.4 13.6 L17.6 13.6 Z" fill="#16202A" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
  <div id="rings"></div>
</div>
<div class="cap" id="cap"><span class="n" id="capn"></span><span class="t" id="capt"></span></div>
<div class="foot"><span class="mark"><img src="../../assets/avatar-h2.png" alt=""><span>olimazi<span class="o">.online</span></span></span><span class="ticks" id="ticks"></span></div>
<div class="end" id="end" style="opacity:0"></div>
<script src="clips.js"></script>
<script>
const Q = new URLSearchParams(location.search), C = CLIPS[Q.get('clip') || 'rm'];
const CAP = '../../.design-loop/clips/cap/';
const WIDE = Q.get('wide') === '1', UW = 1440, UH = 1008, SW = WIDE ? 1200 : 1000, SH = WIDE ? 840 : 700;
const $ = id => document.getElementById(id);
$('kick').innerHTML = C.kicker.replace(' · ', ' <b>·</b> ');
$('ticks').innerHTML = C.scenes.map(() => '<i></i>').join('');
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const cl = (v, a, b) => Math.max(a, Math.min(b, v));
function kf(keys, t) {           // interpolate [t, ...vals] keyframes
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (t <= b[0]) { const p = ease((t - a[0]) / (b[0] - a[0] || 1)); return a.slice(1).map((v, j) => typeof v === 'number' && typeof b[j + 1] === 'number' ? v + (b[j + 1] - v) * p : v); }
  }
  return keys[keys.length - 1].slice(1);
}
function cam(s, t) {
  const [cx, cy, z] = kf(s.cam, t), k = SW / UW * z, vw = UW / z, vh = UH / z;
  return { k, x0: cl(cx - vw / 2, 0, UW - vw), y0: cl(cy - vh / 2, 0, UH - vh) };
}
const map = (c, x, y) => [(x - c.x0) * c.k, (y - c.y0) * c.k];
function place(img, s, c, op, t) {
  // swap: [t, img] shows a second capture of the same screen after a click.
  const src = CAP + (s.swap && t >= s.swap[0] ? s.swap[1] : s.img) + '.png';
  if (img.getAttribute('src') !== src) img.src = src;
  img.style.width = UW + 'px';
  img.style.transform = `translate(${-c.x0 * c.k}px,${-c.y0 * c.k}px) scale(${c.k})`;
  img.style.opacity = op;
}
function headHTML(h) { return h[0] + ' <br><span class="r">' + h[1] + '</span>'; }
let lastHead = '', lastCap = '';
function render(t) {
  const si = Math.max(0, C.scenes.findIndex(s => t >= s.t0 && t < s.t1) === -1 ? C.scenes.length - 1 : C.scenes.findIndex(s => t >= s.t0 && t < s.t1));
  const s = C.scenes[si], c = cam(s, t);
  place($('imA'), s, c, 1, t);
  const prev = C.scenes[si - 1], xf = (t - s.t0) / 0.22;
  if (prev && xf < 1) place($('imB'), prev, cam(prev, prev.t1), 1 - xf, prev.t1); else $('imB').style.opacity = 0;
  // headline + scene ticks
  const hh = headHTML(s.head); if (hh !== lastHead) { $('head').innerHTML = hh; lastHead = hh; }
  $('head').style.opacity = cl((t - s.t0) / 0.3, 0, 1);
  [...$('ticks').children].forEach((e, i) => e.className = i <= si ? 'on' : '');
  // callouts
  let ov = '', tags = '', capN = '', capT = s.sub || '', capT0 = s.t0;
  s.call.forEach((q, i) => {
    const [a, b, x, y, w, h, text] = q;
    if (t < a || t > b) return;
    const p = ease(cl((t - a) / 0.45, 0, 1)), out = cl((b - t) / 0.2, 0, 1);
    const [X, Y] = map(c, x - 6, y - 6), W = (w + 12) * c.k, H = (h + 12) * c.k, per = 2 * (W + H);
    ov += `<rect x="${X}" y="${Y}" width="${W}" height="${H}" fill="none" stroke="#C0392B" stroke-width="4" stroke-dasharray="${per}" stroke-dashoffset="${per * (1 - p)}" opacity="${out}"/>`;
    const n = String(C.scenes.slice(0, si).reduce((m, z) => m + z.call.length, 0) + i + 1).padStart(2, '0');
    tags += `<span class="tag" style="left:${X}px;top:${Math.max(0, Y - 34)}px;opacity:${p * out}">${n}</span>`;
    capN = n; capT = text; capT0 = a;
  });
  $('ov').innerHTML = ov; $('tags').innerHTML = tags;
  const key = capN + capT;
  if (key !== lastCap) { $('capn').textContent = capN; $('capt').textContent = capT; lastCap = key; }
  const cin = cl((t - capT0) / 0.3, 0, 1);
  $('cap').style.opacity = cin; $('cap').style.transform = `translateY(${(1 - ease(cin)) * 14}px)`;
  // cursor
  const cu = $('cur'); let rings = '';
  if (s.cur.length && t >= s.cur[0][0] - 0.3) {
    const pts = s.cur.map(p => [p[0], p[1], p[2]]);
    const [ux, uy] = kf(pts, t), [X, Y] = map(c, ux, uy);
    cu.style.display = 'block'; cu.style.left = (X - 4) + 'px'; cu.style.top = (Y - 2) + 'px';
    cu.style.opacity = cl((t - (s.cur[0][0] - 0.3)) / 0.3, 0, 1);
    s.cur.filter(p => p[3]).forEach(p => {
      const d = t - p[0]; if (d < 0 || d > 0.5) return;
      const [RX, RY] = map(c, p[1], p[2]), r = 8 + d * 70;
      rings += `<span class="ring" style="left:${RX - r}px;top:${RY - r}px;width:${2 * r}px;height:${2 * r}px;opacity:${1 - d / 0.5}"></span>`;
      if (d < 0.12) cu.style.transform = 'scale(.86)'; else cu.style.transform = '';
    });
  } else cu.style.display = 'none';
  $('rings').innerHTML = rings;
  // end card
  const e = C.end, eo = cl((t - e.t0) / 0.4, 0, 1);
  if (!$('end').innerHTML) $('end').innerHTML = `<h2>${e.title[0]}<small>${e.title[1]}</small></h2><p>${e.lines.join('<br>')}</p><div class="cta"><b>${e.cta}</b><span>olimazi<i>.online</i></span></div>`;
  $('end').style.opacity = eo;
}
window.render = render;
window.ready = Promise.all([document.fonts.ready, ...C.scenes.flatMap(s => s.swap ? [s.img, s.swap[1]] : [s.img]).map(n => new Promise(r => { const i = new Image(); i.onload = r; i.onerror = r; i.src = CAP + n + '.png'; }))]);
render(Number(Q.get('t') || 0));
</script>
</body></html>
