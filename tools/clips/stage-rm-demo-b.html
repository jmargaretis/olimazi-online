<!doctype html>
<html><head><meta charset="utf-8">
<title>RM AC demo</title>
<style>
@font-face{font-family:"Satoshi";src:url("../../assets/Satoshi-Black.otf");font-weight:900}
@font-face{font-family:"Satoshi";src:url("../../assets/Satoshi-Bold.otf");font-weight:700}
@font-face{font-family:"Satoshi";src:url("../../assets/Satoshi-Medium.otf");font-weight:500}
:root{--paper:#E9EEF1;--ink:#16202A;--soft:#4E5C68;--ox:#C0392B}
*{box-sizing:border-box;margin:0}
html,body{overflow:hidden;background:var(--paper)}
body{font-family:"Satoshi",system-ui,sans-serif;color:var(--ink);position:relative}
.sc{position:absolute;inset:0;background:var(--paper);overflow:hidden}
.tt{position:absolute;left:64px;font-weight:900;line-height:1;letter-spacing:-.025em}
.sb{position:absolute;left:68px;font-weight:500;line-height:1.3;color:var(--soft)}
.r{color:var(--ox)}
.fr{position:absolute;left:60px;overflow:hidden;border-radius:28px;background:#fff;box-shadow:0 30px 80px rgba(22,32,42,.18),0 0 0 1px rgba(22,32,42,.06)}
.cam{position:absolute;left:0;top:0;width:1440px;height:1400px;transform-origin:0 0}
.cam img{position:absolute;left:0;top:0;width:1440px}
.cut{position:absolute;left:0;width:1440px;height:3000px;background:#D6DEE3}
.spot{position:absolute;border:3px solid var(--ox);border-radius:10px}
.dot{position:absolute;border:3px solid var(--ox);border-radius:50%}
.cur{position:absolute;width:22px;height:30px}
.lift{position:absolute;left:96px;background:#fff;border-left:10px solid var(--ox);border-radius:16px;padding:22px 30px;font-weight:700;line-height:1.25;box-shadow:0 24px 60px rgba(22,32,42,.28);opacity:0}
.lift small{display:block;font-weight:500;color:var(--soft);font-size:.62em;margin-top:6px}
/* step rail */
.rail{position:absolute;left:0;top:0;z-index:999;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;white-space:nowrap}
.rail span{display:flex;align-items:center;gap:8px;color:#9AA6B0}
.rail span i{font-style:normal;width:44px;height:44px;border-radius:50%;border:3px solid currentColor;display:grid;place-items:center;font-size:24px}
.rail span em{font-style:normal;display:none}
.rail span.on em{display:inline}
.rail span.dn{color:var(--ink)}
.rail span.on{color:var(--ox)}
.rail span.on i{background:var(--ox);color:#fff;border-color:var(--ox)}
.rail b{width:18px;height:2px;background:#C3CCD3}
/* tenant email */
.ml{position:absolute;inset:0;padding:44px 50px;font-size:36px;line-height:1.4}
.ml .hd{display:flex;gap:20px;align-items:center;padding-bottom:26px;border-bottom:2px solid #E3E8EC}
.ml .ic{width:76px;height:76px;border-radius:50%;background:#D7DEE3;display:grid;place-items:center;font-weight:900;font-size:34px;color:var(--soft);flex:none}
.ml .fm{font-weight:700}.ml .em{color:var(--soft);font-size:24px}
.ml .sj{font-weight:900;font-size:50px;margin:30px 0 22px;letter-spacing:-.01em}
.ml .at{display:flex;gap:18px;margin-top:30px}
.ml .hl{transition:none;border-radius:8px}
.ml .hl.on{outline:4px solid var(--red);outline-offset:4px;background:#F6E3E0}
.ml .at div{border-radius:999px;background:#E9EEF1;border:2px solid #D3DBE1;padding:10px 22px;font-size:26px;font-weight:700;color:var(--ink)}
/* compare */
.cp{position:absolute;inset:0;padding:50px 44px;display:flex;flex-direction:column;gap:30px}
.cp .row{display:flex;gap:26px}
.cp .tl{flex:1;border-radius:20px;background:#F3F6F8;padding:30px 30px 34px;border:2px solid #E1E7EB}
.cp .tl h4{font-size:24px;font-weight:700;color:var(--soft);text-transform:none;margin-bottom:12px}
.cp .tl p{font-size:26px;font-weight:500;color:var(--soft);line-height:1.35}
.cp .tl .am{font-size:72px;font-weight:900;color:var(--ink);letter-spacing:-.02em;margin:10px 0 6px}
.cp .res{border-radius:20px;background:var(--ox);color:#fff;padding:30px 34px;font-weight:900;font-size:46px;line-height:1.15;opacity:0}
.cp .res small{display:block;font-weight:500;font-size:26px;margin-top:10px;opacity:.92}
/* phone */
.ph{position:absolute;background:#0E1419;border-radius:56px;padding:14px;box-shadow:0 40px 90px rgba(22,32,42,.28)}
.vf{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:radial-gradient(120% 90% at 40% 35%,#4E5C68 0%,#16202A 100%)}
.rc{position:absolute;left:14%;top:12%;width:72%;background:#FBFAF6;box-shadow:0 18px 30px rgba(0,0,0,.35);padding:26px 24px 30px;font-family:"Courier New",monospace;color:#222;font-size:17px;line-height:1.45;transform:rotate(-3deg)}
.rc b{font-family:"Satoshi",sans-serif;font-weight:900;font-size:21px;white-space:nowrap;letter-spacing:.02em;display:block;margin-bottom:6px}
.rc hr{border:0;border-top:2px dashed #999;margin:12px 0}
.rc .tot{display:flex;justify-content:space-between;font-weight:700;font-size:21px}
.gd{position:absolute;width:44px;height:44px;border:4px solid rgba(255,255,255,.92)}
.sh{position:absolute;left:50%;bottom:34px;width:84px;height:84px;margin-left:-42px;border-radius:50%;border:5px solid #fff}
.sh i{position:absolute;inset:6px;border-radius:50%;background:#fff}
.fl{position:absolute;inset:0;background:#fff;opacity:0}
.th{position:absolute;left:30px;bottom:44px;width:62px;height:62px;border-radius:12px;border:3px solid #fff;overflow:hidden;opacity:0;background:#FBFAF6}
.ts{position:absolute;left:20px;right:20px;top:26px;background:rgba(255,255,255,.96);border-radius:16px;padding:14px 16px;font-weight:500;font-size:18px;line-height:1.3;color:var(--ink);opacity:0}
.ts b{display:block;color:var(--ink);font-weight:700;font-size:15px;margin-bottom:2px}
.av{position:absolute;border-radius:28px;-webkit-mask:radial-gradient(circle,#000 62%,transparent 100%)}
.stamp{position:absolute;background:#fff;border-radius:28px;-webkit-mask:radial-gradient(circle,#000 62%,transparent 100%);transform-origin:center;opacity:0}
.mk{position:absolute;font-weight:900}
</style></head>
<body>

    else { const u = cl((lt - T3) / (T4 - T3), 0, 1), c3 = 1.70158, k = (c3 + 1) * u * u * u - c3 * u * u; sc = big + (1 - big) * Math.min(1, k); dy = cy * (1 - k); rot = 360 * cl(k, 0, 1); }

    av.style.opacity = lt >= T4 ? 1 : 0;
    const b = out(cl((lt - T4) / 0.5, 0, 1)), c = out(cl((lt - T4 - 0.3) / 0.5, 0, 1));
    const tt = s.el.querySelector('.tt'); tt.style.opacity = b; tt.style.transform = `translateY(${(1 - b) * 24}px)`;
    s.el.querySelector('.mk').style.opacity = c;

  }
