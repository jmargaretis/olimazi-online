<!doctype html>
<html><head><meta charset="utf-8">
<title>OS clip stage</title>
<style>
@font-face{font-family:"Satoshi";src:url("../../assets/Satoshi-Black.otf");font-weight:900}
@font-face{font-family:"Satoshi";src:url("../../assets/Satoshi-Bold.otf");font-weight:700}
@font-face{font-family:"Satoshi";src:url("../../assets/Satoshi-Medium.otf");font-weight:500}
:root{--paper:#E9EEF1;--ink:#16202A;--soft:#4E5C68;--ox:#C0392B}
*{box-sizing:border-box;margin:0}
html,body{overflow:hidden;background:var(--paper)}
body{font-family:"Satoshi",system-ui,sans-serif;color:var(--ink);position:relative}
.sc{position:absolute;inset:0;opacity:0;overflow:hidden;background:var(--paper)}
.area{position:absolute;left:0;top:0;overflow:hidden}
.area img.ui{position:absolute;left:0;top:0;transform-origin:0 0;width:1440px}
.rule{position:absolute;left:0;height:2px;background:rgba(22,32,42,.12)}
.hd{position:absolute;font-weight:900;letter-spacing:-.02em;line-height:1.02}
.hd .u{position:relative;display:inline-block}
.hd .u img{position:absolute;left:-5%;width:110%;bottom:-.34em}
.sub{position:absolute;font-weight:500;line-height:1.4;color:var(--soft)}
svg.dim{position:absolute;left:0;top:0}
.lab{position:absolute;background:#fff;border-left:8px solid var(--ox);border-radius:6px;box-shadow:0 12px 40px rgba(22,32,42,.25)}
.lab b{display:block;font-weight:900;line-height:1.1}
.lab span{display:block;font-weight:500;line-height:1.4;color:var(--soft);margin-top:10px}
.cursor{position:absolute;width:38px;height:38px;pointer-events:none}
.ring{position:absolute;border:3px solid var(--ox);border-radius:50%}
.open img.ph{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;transform-origin:70% 30%}
.open .t{position:absolute;font-weight:900;white-space:nowrap;color:var(--ink);line-height:1.04}
.av{position:absolute;-webkit-mask:radial-gradient(circle,#000 62%,transparent 100%);border-radius:14px}
.r{color:var(--ox)}
.card{background:var(--ink);color:#fff}
.card .k{position:absolute;font-weight:900;letter-spacing:.2em;color:var(--ox)}
.card .big{position:absolute;font-weight:900;letter-spacing:-.02em;line-height:1}
.card .mark{position:absolute;display:flex;align-items:center;font-weight:900}
.card .mark img{border-radius:12px;-webkit-mask:radial-gradient(circle,#000 62%,transparent 100%)}
</style></head>
<body>
<div id="root"></div>
<script>
// OS clip, storyboard v2 (10/3). UI coordinates are 1440x1008 capture pixels.
// cam: [t, x, y, w, h] = UI region to fit into the screen area.
// spot: [t0, t1, x, y, w, h, line]  cur: [t, x, y, click]  swap: [t, img]
const Q = new URLSearchParams(location.search), WIDE = Q.get('wide') === '1';
const W = WIDE ? 1600 : 1080, H = WIDE ? 1150 : 1350, UW = 1440, UH = 1008, CAP = '../../.design-loop/clips/cap/';
document.documentElement.style.width = document.body.style.width = W + 'px';
document.documentElement.style.height = document.body.style.height = H + 'px';
const LEN = 45, FPS = 30;
const S = [
  { kind: 'open', t0: 0, t1: 3.2 },
  { kind: 'C', t0: 3.2, t1: 9, img: 'os-front', bg: '#E9EEF1',
    head: ['The day starts in ', 'one place', '.'], sub: 'Lanes in the order they clear work. What waits on me, up top.',
    cam: [[3.2, 266, 80, 1160, 640], [4.6, 266, 80, 1160, 640], [5.4, 280, 250, 850, 260], [7.2, 280, 250, 850, 260], [8.0, 640, 530, 780, 300]] },
  { kind: 'C', t0: 9, t1: 14, img: 'os-ideas-top', bg: '#E9EEF1',
    head: ['Saves come in. Only the ', 'new ones', '.'], sub: 'Watch later, two playlists and my bookmarks, pulled each week.',
    cam: [[9, 266, 55, 1150, 95], [10.6, 266, 55, 1150, 95], [11.5, 266, 185, 1150, 385]], cut: 592 },
  { kind: 'D', t0: 14, t1: 21, img: 'os-ideas-card', bg: '#E9EEF1',
    head: 'It reads the whole video. Then it sorts.',
    cam: [[14, 266, 50, 1145, 720]], cam45: [[14, 266, 50, 760, 720]],
    spot: [[14.6, 17.7, 278, 142, 352, 62, 'A router reads it and picks the model.'],
           [17.7, 20.8, 664, 142, 352, 62, 'Then it tags the goal, the lane and the kind.']] },
  { kind: 'D', t0: 21, t1: 29, img: 'os-ideas-card', bg: '#E9EEF1',
    head: 'It says what the idea would move.',
    cam: [[21, 266, 50, 1145, 720], [21.8, 650, 50, 380, 520]], cam45: [[21, 266, 50, 760, 720], [21.8, 650, 50, 380, 520]],
    spot: [[22.2, 25.4, 664, 210, 352, 150, 'A small model writes the note against my goals.'],
           [25.4, 28.8, 664, 364, 202, 34, 'One click turns it into a ticket.']],
    cur: [[25.8, 900, 470], [27.0, 823, 381, 1], [28.8, 823, 381]] },
  // wall: posts and the OS screens that made them, sliding left (tiles are 1000 px tall in cap/)
  { kind: 'C', t0: 29, t1: 35, bg: '#211409', wall: [[1, 844], [2, 800], [3, 859], [4, 800], [5, 800], [6, 1103], [7, 800], [8, 800]],
    head: ['Drafted on the plan I ', 'already pay for', '.'], sub: 'Photo in, draft out. My yes, then the scheduler.' },
  { kind: 'C', t0: 35, t1: 42, img: 'os-brand', bg: '#E9EEF1', swap: [[37.4, 'os-site', '#211409'], [39.9, 'os-site-pane', '#211409']],
    head: ['One kit. ', 'One site', '.'], sub: 'The brand card reads the live site. Then the site itself.',
    cam: [[35, 266, 200, 1130, 520], [37.3, 266, 200, 1130, 520], [37.4, 40, 100, 1360, 560], [38.4, 40, 100, 1360, 560], [39.0, 640, 380, 760, 500], [39.9, 640, 380, 760, 500], [39.91, 480, 20, 960, 440]],
    cur: [[38.5, 1100, 560], [39.5, 813, 790, 1]] },
  { kind: 'B', t0: 42, t1: 45 },
];
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const cl = (v, a, b) => Math.max(a, Math.min(b, v));
function kf(keys, t) {
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (t <= b[0]) { const p = ease((t - a[0]) / (b[0] - a[0] || 1)); return a.slice(1).map((v, j) => typeof v === 'number' ? v + (b[j + 1] - v) * p : v); }
  }
  return keys[keys.length - 1].slice(1);
}
const root = document.getElementById('root');
// layout numbers
const L = WIDE
  ? { cH: 700, hx: 80, hy: 770, hs: 96, sy: 880, ss: 34, sw: 1300, lw: 520, ls: 44, lss: 28 }
  : { cH: 880, hx: 56, hy: 950, hs: 78, sy: 1100, ss: 32, sw: 968, lw: 968, ls: 46, lss: 30 };
function camOf(s, t, aw, ah) {
  const [x, y, w, h] = kf((!WIDE && s.cam45) || s.cam, t), k = Math.min(aw / w, ah / h);
  const vw = aw / k, vh = ah / k;
  let x0 = x + w / 2 - vw / 2, y0 = y + h / 2 - vh / 2;
  x0 = vw >= UW ? (UW - vw) / 2 : cl(x0, 0, UW - vw); y0 = vh >= UH ? (UH - vh) / 2 : cl(y0, 0, UH - vh);
  return { k, x0, y0 };
}
const map = (c, x, y) => [(x - c.x0) * c.k, (y - c.y0) * c.k];
const CUR = '<svg class="cursor" viewBox="0 0 24 24"><path d="M4 2 L4 19 L8.6 14.8 L11.6 21.6 L14.4 20.4 L11.4 13.6 L17.6 13.6 Z" fill="#16202A" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>';
S.forEach(s => {
  const el = s.el = $('<div class="sc"></div>'); root.appendChild(el);
  if (s.kind === 'open') {
    el.className = 'sc open';
    el.innerHTML = `<img class="ph" src="${CAP}os-open.jpg" style="object-position:${WIDE ? 'center' : '78% center'}">`
      + `<div class="t" style="${WIDE ? 'left:1130px;top:150px;font-size:76px' : 'left:470px;top:120px;font-size:72px'}">One person.<br>One brand<span class="r">.</span></div>`
      + `<img class="av" src="${CAP}os-av.png" style="right:${WIDE ? 48 : 40}px;bottom:${WIDE ? 48 : 40}px;width:84px">`;
  } else if (s.kind === 'B') {
    el.className = 'sc card';
    const big = WIDE ? 128 : 112, x = WIDE ? 120 : 64;
    el.innerHTML = `<div class="k" style="left:${x}px;top:${WIDE ? 330 : 430}px;font-size:26px">OLIMAZI · ONE PERSON</div>`
      + `<div class="big" style="left:${x}px;top:${WIDE ? 384 : 484}px;font-size:${big}px">One person<br>runs a brand<span class="r">.</span></div>`
      + `<div class="mark" style="left:${x}px;top:${WIDE ? 720 : 840}px;font-size:40px;gap:18px"><img src="${CAP}os-av.png" style="width:72px"><span>olimazi<span class="r">.online</span></span></div>`;
  } else {
    const aH = s.kind === 'C' ? L.cH : H;
    const th = Math.round(aH * 0.66), wall = s.wall ? `<div class="wall" style="position:absolute;left:0;top:${Math.round(aH * 0.17)}px;display:flex;gap:${WIDE ? 28 : 24}px;align-items:center;width:max-content">${s.wall.map(([n, w], i) => `<img src="${CAP}wall-${n}.png" style="flex:none;height:${th}px;width:${Math.round(w * th / 1000)}px;border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.5);transform:translateY(${i % 2 ? 26 : -26}px)">`).join('')}</div>` : '';
    el.innerHTML = `<div class="area" style="width:${W}px;height:${aH}px;background:${s.bg}">${wall}<img class="ui a" src="${s.img ? CAP + s.img + '.png' : ''}" style="${s.img ? '' : 'display:none'}"><img class="ui b" style="opacity:0"><div class="cut" style="position:absolute;left:0;width:100%;bottom:0;background:linear-gradient(rgba(233,238,241,0),${s.bg} 60px);display:${s.cut ? 'block' : 'none'}"></div></div>`
      + (s.kind === 'C'
        ? `<div class="rule" style="top:${aH}px;width:${W}px"></div><div class="hd" style="left:${L.hx}px;top:${L.hy}px;width:${W - 2 * L.hx}px;font-size:${L.hs}px">${s.head[0]}<span style="white-space:nowrap"><span class="u">${s.head[1]}<img src="${CAP}os-stroke.png"></span>${s.head[2]}</span></div><div class="sub" style="left:${L.hx + 4}px;top:${L.sy}px;width:${L.sw}px;font-size:${L.ss}px">${s.sub}</div>`
        : `<svg class="dim" width="${W}" height="${H}"><path fill="rgba(22,32,42,.62)" fill-rule="evenodd"/><rect fill="none" stroke="#C0392B" stroke-width="4" rx="8"/></svg><div class="lab" style="width:${L.lw}px;padding:26px 30px"><b style="font-size:${L.ls}px">${s.head}</b><span style="font-size:${L.lss}px"></span></div>`)
      + CUR + '<div class="rings"></div>';
    s.aH = aH;
  }
});
function draw(s, t) {
  const el = s.el;
  if (s.kind === 'open') {
    const p = cl(t / 3.2, 0, 1);
    el.querySelector('.ph').style.transform = `scale(${1.04 - 0.04 * p})`;
    const tt = el.querySelector('.t'), a = ease(cl((t - 0.5) / 0.6, 0, 1));
    tt.style.opacity = a; tt.style.transform = `translateY(${(1 - a) * 18}px)`;
    el.querySelector('.av').style.opacity = ease(cl((t - 1.4) / 0.5, 0, 1));
    return;
  }
  if (s.kind === 'B') {
    const lt = t - s.t0, f = (q, d) => ease(cl((lt - d) / 0.5, 0, 1));
    el.querySelector('.k').style.opacity = f(0, 0.1);
    const b = el.querySelector('.big'); b.style.opacity = f(0, 0.25); b.style.transform = `translateY(${(1 - f(0, 0.25)) * 24}px)`;
    const m = el.querySelector('.mark'); m.style.opacity = f(0, 0.9);
    m.querySelector('img').style.transform = `scale(${0.7 + 0.3 * f(0, 0.9)})`;
    return;
  }
  if (s.wall) {
    const row = el.querySelector('.wall'), span = row.scrollWidth - W, p = cl((t - s.t0) / (s.t1 - s.t0), 0, 1);
    row.style.transform = `translateX(${WIDE ? 60 : 48}px) translateX(${-p * (span + (WIDE ? 120 : 96))}px)`;
  }
  // screen + swaps
  const c = s.wall ? { k: 1, x0: 0, y0: 0 } : camOf(s, t, W, s.aH);
  let src = s.img, bg = s.bg;
  (s.swap || []).forEach(w => { if (t >= w[0]) { src = w[1]; bg = w[2]; } });
  const A = el.querySelector('img.a'), area = el.querySelector('.area');
  if (src && A.dataset.n !== src) { A.src = CAP + src + '.png'; A.dataset.n = src; area.style.background = bg; }
  A.style.transform = `translate(${-c.x0 * c.k}px,${-c.y0 * c.k}px) scale(${c.k})`;
  if (s.cut) el.querySelector('.cut').style.top = (map(c, 0, s.cut)[1] - 60) + 'px';
  // swap flash: brief crossfade from the old capture
  const B = el.querySelector('img.b'); let bo = 0;
  (s.swap || []).forEach((w, i) => { const d = t - w[0]; if (d >= 0 && d < 0.25) { const prev = i ? s.swap[i - 1][1] : s.img; if (B.dataset.n !== prev) { B.src = CAP + prev + '.png'; B.dataset.n = prev; } bo = 1 - d / 0.25; } });
  B.style.opacity = bo; B.style.transform = A.style.transform;
  const lt = t - s.t0;
  if (s.kind === 'C') {
    const hd = el.querySelector('.hd'), a = ease(cl((lt - 0.2) / 0.5, 0, 1));
    hd.style.opacity = a; hd.style.transform = `translateY(${(1 - a) * 20}px)`;
    const w = ease(cl((lt - 0.8) / 0.55, 0, 1));
    hd.querySelector('.u img').style.clipPath = `inset(0 ${100 - w * 100}% 0 0)`;
    const sb = el.querySelector('.sub'), b = ease(cl((lt - 0.6) / 0.5, 0, 1));
    sb.style.top = (hd.offsetTop + hd.offsetHeight + 30) + 'px';
    sb.style.opacity = b; sb.style.transform = `translateY(${(1 - b) * 14}px)`;
  } else {
    // spotlight: hole moves between spots; dim fades in and out
    const sp = s.spot, i = Math.max(0, sp.findIndex(q => t >= q[0] && t < q[1]) === -1 ? (t < sp[0][0] ? 0 : sp.length - 1) : sp.findIndex(q => t >= q[0] && t < q[1]));
    const q = sp[i], pq = sp[i - 1], m = pq ? ease(cl((t - q[0]) / 0.45, 0, 1)) : 1;
    const rect = pq ? q.slice(2, 6).map((v, j) => pq[2 + j] + (v - pq[2 + j]) * m) : q.slice(2, 6);
    const pad = 8, [X, Y] = map(c, rect[0] - pad, rect[1] - pad), RW = (rect[2] + 2 * pad) * c.k, RH = (rect[3] + 2 * pad) * c.k;
    const on = ease(cl((t - sp[0][0]) / 0.4, 0, 1)) * cl((sp[sp.length - 1][1] - t) / 0.3, 0, 1);
    const svg = el.querySelector('svg.dim'), path = svg.querySelector('path'), r = svg.querySelector('rect');
    path.setAttribute('d', `M0 0H${W}V${H}H0Z M${X} ${Y}h${RW}v${RH}h${-RW}Z`); path.style.opacity = on;
    Object.entries({ x: X, y: Y, width: RW, height: RH }).forEach(([k, v]) => r.setAttribute(k, v)); r.style.opacity = on;
    const lab = el.querySelector('.lab'), ls = lab.querySelector('span');
    if (ls.textContent !== q[6]) ls.textContent = q[6];
    const lw = L.lw, lh = lab.offsetHeight;
    let lx, ly;
    if (WIDE) { lx = X + RW / 2 < W / 2 ? Math.min(W - lw - 48, X + RW + 56) : Math.max(48, X - lw - 56); ly = cl(Y + RH / 2 - lh / 2, 48, H - lh - 48); if (lx < X + RW && lx + lw > X) ly = Y + RH + 48 + lh < H ? Y + RH + 48 : Math.max(48, Y - lh - 48); }
    else { lx = 56; ly = H - (Y + RH) > Y ? Math.min(H - lh - 56, Y + RH + 48) : Math.max(56, Y - lh - 48); }
    lab.style.left = lx + 'px'; lab.style.top = ly + 'px';
    const la = ease(cl((t - sp[0][0] - 0.15) / 0.45, 0, 1)) * cl((sp[sp.length - 1][1] - t) / 0.3, 0, 1);
    lab.style.opacity = la; lab.style.transform = `translateY(${(1 - la) * 16}px)`;
  }
  // cursor
  const cu = el.querySelector('.cursor'); let rings = '';
  if (s.cur && t >= s.cur[0][0] - 0.3) {
    const [ux, uy] = kf(s.cur.map(p => p.slice(0, 3)), t), [X, Y] = map(c, ux, uy);
    cu.style.display = 'block'; cu.style.left = (X - 4) + 'px'; cu.style.top = (Y - 2) + 'px';
    cu.style.opacity = cl((t - (s.cur[0][0] - 0.3)) / 0.3, 0, 1); cu.style.transform = '';
    s.cur.filter(p => p[3]).forEach(p => {
      const d = t - p[0]; if (d < 0 || d > 0.5) return;
      const [RX, RY] = map(c, p[1], p[2]), rr = 8 + d * 70;
      rings += `<span class="ring" style="left:${RX - rr}px;top:${RY - rr}px;width:${2 * rr}px;height:${2 * rr}px;opacity:${1 - d / 0.5}"></span>`;
      if (d < 0.12) cu.style.transform = 'scale(.86)';
    });
  } else cu.style.display = 'none';
  el.querySelector('.rings').innerHTML = rings;
}
const XF = 0.35;
function render(t) {
  S.forEach((s, i) => {
    const next = S[i + 1];
    let o = 0;
    if (t >= s.t0 && t < s.t1) o = 1;
    if (next && t >= next.t0 && t < next.t0 + XF) o = 1;             // outgoing stays under the fade
    if (i && t >= s.t0 && t < s.t0 + XF) o = ease((t - s.t0) / XF);   // incoming fades in on top
    if (t >= LEN && i === S.length - 1) o = 1;
    s.el.style.opacity = o; s.el.style.zIndex = i;
    if (o > 0) draw(s, Math.min(t, s.t1));
  });
}
window.CLIP = { fps: FPS, len: LEN };
window.render = render;
const imgs = ['os-open.jpg', 'os-av.png', 'os-stroke.png', ...new Set(S.flatMap(s => [s.img, ...(s.swap || []).map(w => w[1]), ...(s.wall || []).map(w => 'wall-' + w[0])]).filter(Boolean).map(n => n + '.png'))];
window.ready = Promise.all([document.fonts.ready, ...imgs.map(n => new Promise(r => { const i = new Image(); i.onload = r; i.onerror = r; i.src = CAP + n; }))]);
render(Number(Q.get('t') || 0));
</script>
</body></html>
